<!DOCTYPE html>
<!--
  The webview page as extension.js builds it (getHtml), with four differences:
  the resources are loaded over file:// instead of the webview scheme, there is
  no CSP (nothing here is remote anyway), acquireVsCodeApi is a shim that
  records what the webview posts to the host in window.__posts, and the sheet
  VS Code injects into a webview of its own is replayed below, since nothing
  here is inside VS Code to inject it.

  The values the host interpolates are read from window.__settings, __palette,
  __side and __themes, which the test seeds with evaluateOnNewDocument before
  the page loads.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
  What VS Code drops into every webview of its own (the _defaultStyles sheet of
  pre/index.html), or the part of it the editor has to live with: the bars of
  every scroller in the page are set from the host's colours, and
  scrollbar-color is inherited, so the setting reaches every box of the editor
  and disables any ::-webkit-scrollbar rule it meets on the way. Without this
  the harness draws bars no webview ever draws. The fallbacks stand for a VS
  Code on a dark theme, which is the case that put a black bar down a light
  panel. The rest of that sheet (type, links, code) is left out: the editor
  overrides all of it inside #app.
-->
<style>
@layer vscode-default {
  html {
    scrollbar-color: var(--vscode-scrollbarSlider-background, rgba(121, 121, 121, 0.4))
      var(--vscode-editor-background, #1f1f1f);
  }
  ::-webkit-scrollbar {
    width: 10px;
    height: 10px;
  }
  ::-webkit-scrollbar-corner {
    background-color: var(--vscode-editor-background, #1f1f1f);
  }
  ::-webkit-scrollbar-thumb {
    background-color: var(--vscode-scrollbarSlider-background, rgba(121, 121, 121, 0.4));
  }
}
</style>
<link rel="stylesheet" href="../../vscode-mdm/media/vendor/cm6/katex.min.css">
<link rel="stylesheet" href="../../vscode-mdm/media/vendor/abcjs/abcjs-audio.css">
<link rel="stylesheet" href="../../vscode-mdm/media/style.css">
<script>
// The two bases the host builds from the document's own URI: the folder it
// is in and the root of its filesystem. A test that draws images seeds them.
window.MDM_DOC_BASE = window.__docBase || "";
window.MDM_FILE_BASE = window.__fileBase || "";
window.MDM_SOUNDFONT = "../../vscode-mdm/media/vendor/soundfont/";
window.MDM_SETTINGS = Object.assign(
  {
    theme: "light",
    scoreFill: "none",
    staffLines: "gray",
    scoreAlign: "center",
    frontMatter: "shown",
    outline: "hidden",
    outlineWidth: 250,
    multicursorMatch: "word",
    followPlayhead: "follow",
    textFont: "roman",
    hyphenation: "none",
    multiCursorModifier: "alt",
  },
  window.__settings || {}
);
window.MDM_PALETTE = { palette: window.__palette || null, side: window.__side || null };
window.MDM_THEMES = window.__themes || [];
window.__posts = [];
window.acquireVsCodeApi = function () {
  return {
    postMessage: function (m) {
      window.__posts.push(m);
      // A test that wants the real round trip runs extension.js in node and
      // exposes __toHost; the messages the host posts back come in through
      // window.postMessage, exactly as they do inside VS Code.
      if (window.__toHost) window.__toHost(m);
    },
  };
};
</script>
<script src="../../vscode-mdm/media/vendor/cm6/cm6.bundle.js"></script>
<script src="../../vscode-mdm/media/vendor/abcjs/abcjs-basic-min.js"></script>
<script src="../../vscode-mdm/media/hyphenation-patterns.js"></script>
<script src="../../vscode-mdm/media/mdm-hyphenation.js"></script>
</head>
<body>
<div id="app"></div>
<script src="../../vscode-mdm/media/main.js"></script>
</body>
</html>
